<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lottie Animation</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
    <style>
        #animation { width: min(100%, 440px); height: 300px; margin: auto; }
        .controls { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
    </style>
</head>
<body>
    <main class="example-shell">
        <div class="eyebrow">Third-party animation API</div>
        <h1>Lottie animation controls</h1>
        <p class="hint">This example loads a small animation from LottieFiles, then uses click events to call the animation API. An internet connection is needed for the library and JSON file.</p>
        <div id="animation" aria-label="Lottie animation"></div>
        <div class="controls">
            <button type="button" data-action="play">Play</button>
            <button type="button" data-action="pause">Pause</button>
            <button type="button" data-action="stop">Stop</button>
        </div>
        <p class="status" id="status" aria-live="polite">Loading animation…</p>
        <nav class="example-nav"><a href="index.html">← All examples</a></nav>
    </main>
    <script>
        const status = document.querySelector("#status");
        const animation = lottie.loadAnimation({
            container: document.querySelector("#animation"),
            renderer: "svg",
            loop: true,
            autoplay: true,
            path: "https://assets10.lottiefiles.com/packages/lf20_touohxv0.json"
        });
        animation.addEventListener("DOMLoaded", () => status.textContent = "Animation loaded and playing.");
        animation.addEventListener("complete", () => status.textContent = "Animation completed.");
        document.querySelectorAll("[data-action]").forEach(button => {
            button.addEventListener("click", () => {
                const action = button.dataset.action;
                animation[action]();
                const labels = { play: "playing", pause: "paused", stop: "stopped" };
                status.textContent = `Animation ${labels[action]}.`;
            });
        });
    </script>
</body>
</html>
