<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Custom Video Player</title>
    <link rel="stylesheet" href="styles.css">

    <style>
        .player { overflow: hidden; border: 1px solid #202b42; border-radius: 20px; background: #101727; box-shadow: 0 22px 45px rgba(16, 23, 39, .24); }
        .player-head { display: flex; justify-content: space-between; gap: 14px; padding: 18px 20px; color: #fff; }
        .player-head strong { display: block; margin-bottom: 4px; }
        .player-head small { color: #9ba9c4; }
        .live-dot { color: #ff8c76; font-size: .75rem; font-weight: 800; letter-spacing: .1em; }
        .video-frame { position: relative; background: #080d18; }
        video { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; }
        .controls { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 14px 18px 18px; color: #dce5f5; }
        .controls button { padding: 9px 14px; background: #25324b; box-shadow: none; }
        .controls button:first-child { background: linear-gradient(135deg, #6e70f3, #11b4bf); }
        .controls label { display: flex; align-items: center; gap: 8px; margin-left: auto; font-size: .86rem; }
        #progress { display: block; width: calc(100% - 36px); height: 5px; margin: 0 18px; accent-color: #54d3cf; }
        #volume { width: 90px; accent-color: #54d3cf; }
        #speed { padding: 8px; color: #fff; border: 1px solid #3d4b67; border-radius: 8px; background: #25324b; }
        #time { color: #9ba9c4; font-size: .86rem; font-variant-numeric: tabular-nums; }
        #message { margin: 16px 0 0; color: var(--muted); }
        @media (max-width: 600px) { .controls label { margin-left: 0; } }
    </style>
</head>

<body>
    <main class="example-shell">
        <div class="topbar"><div class="brand"><span class="brand-mark">▶</span> Studio Player</div><a href="index.html">All examples</a></div>
        <div class="eyebrow">Media API + events</div>
        <h1>Custom video player</h1>
        <p class="hint">A realistic player surface built from a native video element. Try the controls, then inspect the media events in the script.</p>
        <section class="player">
            <div class="player-head"><div><strong>Spring morning</strong><small>Nature collection · 00:35</small></div><span class="live-dot">● HD</span></div>
            <div class="video-frame">
                <video id="video" poster="https://images.unsplash.com/photo-1497250681960-ef046c08a56e?w=1000&q=80">
                    <source src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4" type="video/mp4">
                </video>
            </div>
            <input type="range" id="progress" min="0" value="0" aria-label="Video progress">
            <div class="controls">
                <button id="playBtn" type="button">Play</button>
                <button id="pauseBtn" type="button">Pause</button>
                <span id="time">00:00 / 00:00</span>
                <label>Volume <input type="range" id="volume" min="0" max="1" step="0.1" value="1"></label>
                <button id="muteBtn" type="button">Mute</button>
                <select id="speed" aria-label="Playback speed">
            <option value="0.5">0.5x</option>
            <option value="1" selected>1x</option>
            <option value="1.5">1.5x</option>
            <option value="2">2x</option>
                </select>
            </div>
        </section>
        <p id="message">Video is ready.</p>
        <nav class="example-nav"><a href="index.html">← All examples</a></nav>
    </main>


    <script>

        const video = document.querySelector("#video");

        const playBtn = document.querySelector("#playBtn");
        const pauseBtn = document.querySelector("#pauseBtn");

        const time = document.querySelector("#time");
        const progress = document.querySelector("#progress");

        const muteBtn = document.querySelector("#muteBtn");
        const volume = document.querySelector("#volume");

        const speed = document.querySelector("#speed");

        const message = document.querySelector("#message");


        playBtn.addEventListener("click", function () {

            video.play();

        });

        pauseBtn.addEventListener("click", function () {

            video.pause();

        });


        video.addEventListener("play", function () {

            message.textContent = "Video started.";

        });


        video.addEventListener("pause", function () {

            message.textContent = "Video paused.";

        });


        video.addEventListener("ended", function () {

            message.textContent = "Video completed.";

        });

        video.addEventListener("timeupdate", function () {

            progress.value = video.currentTime;

            time.textContent =
                formatTime(video.currentTime)
                + " / " +
                formatTime(video.duration);

        });

        video.addEventListener("loadedmetadata", function () {

            progress.max = video.duration;

            time.textContent =
                "00:00 / " +
                formatTime(video.duration);

        });

        progress.addEventListener("input", function () {

            video.currentTime = progress.value;

        });

        volume.addEventListener("input", function () {

            video.volume = volume.value;

        });

        muteBtn.addEventListener("click", function () {

            video.muted = !video.muted;

            if (video.muted) {
                muteBtn.textContent = "Unmute";
            } else {
                muteBtn.textContent = "Mute";
            }

        });

        video.addEventListener("volumechange", function () {

            message.textContent =
                "Volume: " +
                Math.round(video.volume * 100) +
                "%";

        });

        speed.addEventListener("change", function () {

            video.playbackRate = speed.value;

            message.textContent =
                "Speed: " + speed.value + "x";

        });


        function formatTime(seconds) {

            if (isNaN(seconds)) {
                return "00:00";
            }

            let minutes = Math.floor(seconds / 60);

            let remainingSeconds =
                Math.floor(seconds % 60);

            if (remainingSeconds < 10) {
                remainingSeconds =
                    "0" + remainingSeconds;
            }

            if (minutes < 10) {
                minutes = "0" + minutes;
            }

            return minutes + ":" + remainingSeconds;
        }

    </script>

</body>

</html>
