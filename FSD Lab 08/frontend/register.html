<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register | University Course Management System</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <h1>Create account</h1>
      <p class="subtitle">Register as a student to view courses</p>
      <div id="alert" class="alert" role="alert"></div>
      <form id="registerForm" novalidate>
        <label for="fullName">Full name</label>
        <input type="text" id="fullName" autocomplete="name" required>
        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="email" required>
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="new-password" minlength="6" required>
        <button type="submit" class="full">Register</button>
      </form>
      <p class="switch">Already registered? <a href="login.html">Log in</a></p>
    </div>
  </div>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
