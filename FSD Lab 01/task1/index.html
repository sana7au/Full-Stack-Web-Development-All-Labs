<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Stack Visualizer</title>

    <link rel="stylesheet" href="style.css">

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>

<body>

    <div class="container">

        <h1>Stack Visualizer</h1>

        <p class="description">
            Click a number to push it into the stack.
            Click the top value to pop it.
        </p>

        <button id="randomBtn">Generate Random Number</button>

        <h2>Available Values</h2>

        <div id="availableValues" class="values"></div>

        <h2>Stack</h2>

        <div id="stack" class="stack"></div>

        <p id="message">Stack is empty.</p>

    </div>

    <script src="script.js"></script>

</body>
</html>
